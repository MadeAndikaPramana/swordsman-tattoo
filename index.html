<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Swordsman Tattoo Studio Bali — custom tattoos & piercing in Legian, Kuta. Book via WhatsApp." />
    <title>Swordsman Tattoo Studio Bali</title>
    <!-- fallback for crawlers that don't run JS; useDocumentHead overrides this per-route once React mounts -->
    <link rel="canonical" href="https://swordsman-tattoo.vercel.app/" />

    <!--
      Social preview (OG/Twitter) tags. This is a client-rendered SPA with no
      server-side rendering, so link-preview crawlers (WhatsApp, Facebook,
      iMessage, etc.) always see THIS static markup — never the per-page
      title/description set by useDocumentHead. Every shared link (whichever
      page) will show this same preview. Proper per-route previews would
      need SSR/prerendering.

      og:url and og:image are hardcoded to the current vercel.app domain —
      update both if/when a custom domain is added.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swordsman Tattoo Studio Bali" />
    <meta property="og:title" content="Swordsman Tattoo Studio Bali" />
    <meta
      property="og:description"
      content="Custom tattoos & piercing in Legian, Kuta — 4.9★ on Google. Book via WhatsApp."
    />
    <meta property="og:url" content="https://swordsman-tattoo.vercel.app/" />
    <meta property="og:image" content="https://swordsman-tattoo.vercel.app/images/studio.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swordsman Tattoo Studio Bali" />
    <meta
      name="twitter:description"
      content="Custom tattoos & piercing in Legian, Kuta — 4.9★ on Google. Book via WhatsApp."
    />
    <meta name="twitter:image" content="https://swordsman-tattoo.vercel.app/images/studio.jpg" />

    <!--
      LocalBusiness structured data (schema.org / JSON-LD). Static and
      site-wide by design — this describes the business itself, not a
      specific page, so it doesn't need to vary per route the way
      title/description do. Helps Google show rich results (rating, hours,
      address) directly in search listings. reviewCount/ratingValue are the
      real, verified numbers from the studio's Google Maps listing — update
      here if they change materially.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Swordsman Tattoo Studio Legian",
        "image": "https://swordsman-tattoo.vercel.app/images/studio.jpg",
        "url": "https://swordsman-tattoo.vercel.app/",
        "telephone": "+62 878-4297-5436",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Jl. Raya Legian No.398",
          "addressLocality": "Legian",
          "addressRegion": "Bali",
          "postalCode": "80361",
          "addressCountry": "ID"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "10:00",
          "closes": "21:00"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "258"
        },
        "sameAs": ["https://www.instagram.com/swordsmantattoostudiobali/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
